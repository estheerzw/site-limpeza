<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nass Cleaning | Professional Home Cleaning</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="container header-container">
            
            <a href="#home" aria-label="Nass Cleaning home">
                <img class="logo-img" src="img/logo-nass-cleaning.png" alt="Nass Cleaning Logo">
            </a>
            
            <nav class="main-nav" aria-label="Primary navigation">
                <ul class="nav-list">
                    <li><a href="#home" class="nav-link">Home</a></li>
                    <li><a href="#services" class="nav-link">Services</a></li>
                    <li><a href="#area" class="nav-link">Area</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            
            <a href="#quote" class="btn btn-primary">Get a Quote</a>

        </div>
    </header>

    <main>
        
        <section class="hero" aria-labelledby="hero-heading">
            <div class="container hero-grid">
                
                <div class="hero-content">
                    <h1 id="hero-heading" class="hero-title">Spotless Cleaning For Your Home</h1>
                    <p class="hero-description">
                        Professional, reliable, and trusted cleaning services tailored to your lifestyle
                    </p>
                    <a href="#booking" class="btn btn-secondary">Book A Cleaning Now</a>
                </div>

                <div class="hero-image-wrapper">
                    <!-- Usando um placeholder de sala enquanto não temos a foto final cortada -->
                    <img class="hero-img" src="img/hero-image.jpeg" alt="Bright, professionally cleaned living room">
                </div>

            </div>
        </section>

        <section class="trust-bar" aria-label="Cleaning service benefits">
            <div class="container">
                <div class="trust-bar-container">
                    <div class="trust-item">✓ Fully Insured</div>
                    <div class="trust-item">✓ Eco-Friendly Products</div>
                    <div class="trust-item">✓ 5-Star Ratings</div>
                </div>
            </div>
        </section>

    </main>

</body>
</html>
